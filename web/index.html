<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0322">
<title>Corrupt Office Extractor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: radial-gradient(ellipse at top, #0f0322 0%, #08010f 70%);
    color: #f5f3ff;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
  }
  .orbs { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.45; }
  .o1 { width: 480px; height: 480px; background: #ff2e93; top: -140px; left: -120px; }
  .o2 { width: 420px; height: 420px; background: #7c3aed; bottom: -140px; right: -100px; }
  .wrap { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 {
    font-size: 2.4rem; font-weight: 800; letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ff2e93 0%, #22d3ee 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 6px;
  }
  .tagline { color: rgba(245,243,255,0.7); margin-bottom: 28px; }
  .drop {
    border: 2px dashed rgba(255,255,255,0.25); border-radius: 16px;
    padding: 48px 24px; text-align: center; cursor: pointer;
    background: rgba(20,10,40,0.5); transition: border-color .2s, background .2s;
  }
  .drop.over { border-color: #22d3ee; background: rgba(34,211,238,0.08); }
  .drop p { color: rgba(245,243,255,0.85); margin-bottom: 6px; }
  .drop small { color: rgba(245,243,255,0.5); }
  .drop input { display: none; }
  .results { margin-top: 28px; display: none; }
  .results.visible { display: block; }
  .summary {
    padding: 18px 22px; background: rgba(20,10,40,0.6);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    margin-bottom: 18px;
  }
  .summary .row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.92rem; }
  .summary .row span { color: rgba(245,243,255,0.7); }
  .summary .row b { color: #22d3ee; }
  .pane {
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 16px 18px;
    max-height: 360px; overflow: auto;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 0.86rem; white-space: pre-wrap; word-break: break-word;
  }
  .pane h3 { font-family: 'Inter', sans-serif; margin-bottom: 8px; color: #ff2e93; font-size: 0.95rem; }
  .images { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
  .images img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #111; }
  .warnings { color: #ffd166; }
  .err { color: #ff7777; }
  footer { margin-top: 36px; text-align: center; color: rgba(245,243,255,0.4); font-size: 0.82rem; }
  footer a { color: rgba(245,243,255,0.6); }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
  button {
    appearance: none; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(124,58,237,0.2); color: #f5f3ff;
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
    font-size: 0.88rem; font-weight: 600;
  }
  button:hover { background: rgba(124,58,237,0.35); }
</style>
</head>
<body>
<div class="orbs" aria-hidden="true">
  <div class="orb o1"></div><div class="orb o2"></div>
</div>
<div class="wrap">
  <header>
    <h1>Corrupt Office Extractor</h1>
    <p class="tagline">Recover text and images from broken DOCX, XLSX, and PPTX files. Runs entirely in your browser — your file never leaves your device.</p>
  </header>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".docx,.xlsx,.pptx,.zip" />
    <p><b>Drop a corrupt Office file here</b> or click to browse</p>
    <small>.docx · .xlsx · .pptx — up to 100 MB · 100% client-side</small>
  </label>

  <section class="results" id="results">
    <div class="summary" id="summary"></div>
    <div class="grid">
      <div class="pane">
        <h3>Recovered text</h3>
        <div id="text"></div>
        <p style="margin-top:10px"><button id="dl-text">Download as .txt</button></p>
      </div>
      <div class="pane">
        <h3>Entries found</h3>
        <div id="entries"></div>
      </div>
    </div>
    <div class="pane" id="images-pane" style="margin-top:14px; display:none">
      <h3>Embedded images</h3>
      <div class="images" id="images"></div>
    </div>
    <div class="pane warnings" id="warnings-pane" style="margin-top:14px; display:none">
      <h3 style="color:#ffd166">Warnings</h3>
      <div id="warnings"></div>
    </div>
  </section>

  <footer>
    <p>v2.0.0 · <a href="https://github.com/socrtwo/crrptoffcxtrctr-SF" target="_blank" rel="noopener">Source on GitHub</a></p>
  </footer>
</div>

<script type="module">
  import { extractFromBuffer } from "./lib/core.js";

  const dropEl = document.getElementById("drop");
  const fileEl = document.getElementById("file");
  const resultsEl = document.getElementById("results");
  const summaryEl = document.getElementById("summary");
  const textEl = document.getElementById("text");
  const entriesEl = document.getElementById("entries");
  const warnPane = document.getElementById("warnings-pane");
  const warnEl = document.getElementById("warnings");
  const imgPane = document.getElementById("images-pane");
  const imgEl = document.getElementById("images");
  const dlText = document.getElementById("dl-text");

  let lastText = "";
  let lastFilename = "extracted";

  async function handleFile(file) {
    if (!file) return;
    lastFilename = file.name.replace(/\.(docx|xlsx|pptx|zip)$/i, "") || "extracted";
    const ab = await file.arrayBuffer();
    const result = extractFromBuffer(new Uint8Array(ab));
    render(result, file);
  }

  function render(r, file) {
    resultsEl.classList.add("visible");
    summaryEl.innerHTML = `
      <div class="row">
        <span>File: <b>${escapeHtml(file.name)}</b></span>
        <span>Size: <b>${(file.size / 1024).toFixed(1)} KB</b></span>
        <span>Type: <b>${r.kind}</b></span>
        <span>Entries: <b>${r.scan.entries.length}</b></span>
        <span>Images: <b>${r.images.length}</b></span>
      </div>`;

    lastText = r.text || "(no text recovered)";
    textEl.textContent = lastText;

    entriesEl.innerHTML = r.scan.entries.map(e => {
      const status = e.decompressionError
        ? `<span class="err">⚠ ${escapeHtml(e.decompressionError)}</span>`
        : (e.crcMismatch ? `<span class="warnings">CRC mismatch</span>` : "OK");
      return `<div>${escapeHtml(e.name)} — ${e.uncompressedSize} B — ${status}</div>`;
    }).join("");

    if (r.images.length) {
      imgPane.style.display = "block";
      imgEl.innerHTML = "";
      for (const img of r.images) {
        const blob = new Blob([img.data]);
        const url = URL.createObjectURL(blob);
        const node = document.createElement("img");
        node.src = url;
        node.title = img.name;
        node.alt = img.name;
        imgEl.appendChild(node);
      }
    } else {
      imgPane.style.display = "none";
    }

    if (r.scan.warnings.length) {
      warnPane.style.display = "block";
      warnEl.innerHTML = r.scan.warnings.map(w => `<div>• ${escapeHtml(w)}</div>`).join("");
    } else {
      warnPane.style.display = "none";
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  dropEl.addEventListener("click", () => fileEl.click());
  fileEl.addEventListener("change", e => handleFile(e.target.files[0]));
  dropEl.addEventListener("dragover", e => { e.preventDefault(); dropEl.classList.add("over"); });
  dropEl.addEventListener("dragleave", () => dropEl.classList.remove("over"));
  dropEl.addEventListener("drop", e => {
    e.preventDefault();
    dropEl.classList.remove("over");
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  dlText.addEventListener("click", () => {
    const blob = new Blob([lastText], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = lastFilename + ".txt";
    a.click();
    URL.revokeObjectURL(url);
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
</script>
</body>
</html>

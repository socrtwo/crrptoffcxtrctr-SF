name: Build & release cross-platform artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach artifacts to (e.g. v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  fixtures-and-core:
    name: Fixtures + core tests
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run fixtures
      - run: npm test
      - run: npm run build:core
      - run: npm run build:web
      - name: Zip web bundle
        run: |
          cd dist/web && zip -r "../../web-${RELEASE_VERSION}.zip" . && cd -
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web-*.zip

  desktop-linux:
    needs: fixtures-and-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run fixtures
      - run: npm run build:core
      - run: npm run build:web
      - name: Install desktop deps (standalone, not workspace)
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Prepare renderer
        working-directory: desktop
        run: npm run prepare-renderer
      - name: Build Electron Linux (AppImage + deb)
        working-directory: desktop
        run: npx electron-builder --linux AppImage deb --publish never
      - name: Headless smoke test
        working-directory: desktop
        run: node smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.deb

  desktop-windows:
    needs: fixtures-and-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run fixtures
      - run: npm run build:core
      - run: npm run build:web
      - name: Install desktop deps (standalone, not workspace)
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Prepare renderer
        working-directory: desktop
        run: npm run prepare-renderer
      - name: Build Electron Windows (nsis + zip)
        working-directory: desktop
        run: npx electron-builder --win nsis zip --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip

  desktop-mac:
    needs: fixtures-and-core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run fixtures
      - run: npm run build:core
      - run: npm run build:web
      - name: Install desktop deps (standalone, not workspace)
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Prepare renderer
        working-directory: desktop
        run: npm run prepare-renderer
      - name: Build Electron macOS (unsigned dmg)
        working-directory: desktop
        run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-desktop
          path: dist/desktop/*.dmg

  android:
    needs: fixtures-and-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: npm ci
      - run: npm run fixtures
      - run: npm run build:core
      - run: npm run build:web
      - name: Generate native android project
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx --yes cap add android
          fi
          npm run sync
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk

  pwa-bundles:
    name: ChromeOS + iOS PWA bundles
    needs: fixtures-and-core
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run fixtures
      - run: npm run build:core
      - run: npm run build:web
      - name: Build ChromeOS bundle
        run: |
          rm -rf pkg && mkdir -p pkg
          cp -r dist/web/. pkg/
          printf '%s\n' \
            '# crrptoffcxtrctr on ChromeOS' \
            '' \
            '## Recommended: install the hosted app' \
            '' \
            '1. Open https://socrtwo.github.io/crrptoffcxtrctr-SF/ in Chrome.' \
            '2. Click the Install icon in the address bar (right-hand side).' \
            '3. The app is added to your launcher and runs in its own window.' \
            '' \
            '## Offline alternative' \
            '' \
            'Unzip this archive and open `index.html` in Chrome.' \
            > pkg/INSTALL.md
          cd pkg && zip -r "../crrptoffcxtrctr-chromeos-${RELEASE_VERSION}.zip" . && cd -
      - name: Build iOS bundle
        run: |
          rm -rf pkg && mkdir -p pkg
          cp -r dist/web/. pkg/
          printf '%s\n' \
            '# crrptoffcxtrctr on iOS / iPadOS' \
            '' \
            '## Add the hosted app to your Home Screen' \
            '' \
            '1. Open https://socrtwo.github.io/crrptoffcxtrctr-SF/ in Safari.' \
            '2. Tap the Share button.' \
            '3. Tap "Add to Home Screen", then "Add".' \
            '4. Launch the app from the Home Screen icon like a native app.' \
            '' \
            'A native iOS build requires Xcode and an Apple Developer' \
            'certificate; see tests/MANUAL.md in the repository.' \
            > pkg/INSTALL.md
          cd pkg && zip -r "../crrptoffcxtrctr-ios-${RELEASE_VERSION}.zip" . && cd -
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-bundles
          path: |
            crrptoffcxtrctr-chromeos-*.zip
            crrptoffcxtrctr-ios-*.zip

  release:
    needs: [fixtures-and-core, desktop-linux, desktop-windows, desktop-mac, android, pwa-bundles]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Show artifacts
        run: find artifacts -type f
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true

  # iOS isn't built in CI: codesigning + Apple Developer cert are required.
  # Run locally per tests/MANUAL.md after pulling the tag, then attach the
  # resulting .ipa to the release manually.
  ios-doc:
    name: iOS (manual — see tests/MANUAL.md)
    runs-on: ubuntu-latest
    steps:
      - run: echo "iOS build is documented in tests/MANUAL.md; not run in CI."

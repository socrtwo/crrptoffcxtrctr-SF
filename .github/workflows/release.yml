name: Build & release cross-platform artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach artifacts to (e.g. v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  fixtures-and-core:
    name: Fixtures + core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run fixtures
      - run: npm test
      - run: npm run build:core
      - run: npm run build:web
      - name: Zip web bundle
        run: |
          cd dist/web && zip -r ../../web-${{ github.ref_name }}.zip . && cd -
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web-*.zip

  desktop-linux:
    needs: fixtures-and-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run fixtures
      - run: npm run build:core
      - run: npm run build:web
      - name: Install desktop deps (standalone, not workspace)
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Prepare renderer
        working-directory: desktop
        run: npm run prepare-renderer
      - name: Build Electron Linux (AppImage + deb)
        working-directory: desktop
        run: npx electron-builder --linux AppImage deb --publish never
      - name: Headless smoke test
        working-directory: desktop
        run: node smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.deb

  desktop-windows:
    needs: fixtures-and-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run fixtures
      - run: npm run build:core
      - run: npm run build:web
      - name: Install desktop deps (standalone, not workspace)
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Prepare renderer
        working-directory: desktop
        run: npm run prepare-renderer
      - name: Build Electron Windows (nsis + zip)
        working-directory: desktop
        run: npx electron-builder --win nsis zip --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip

  desktop-mac:
    needs: fixtures-and-core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run fixtures
      - run: npm run build:core
      - run: npm run build:web
      - name: Install desktop deps (standalone, not workspace)
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Prepare renderer
        working-directory: desktop
        run: npm run prepare-renderer
      - name: Build Electron macOS (unsigned dmg)
        working-directory: desktop
        run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-desktop
          path: dist/desktop/*.dmg

  android:
    needs: fixtures-and-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: npm ci
      - run: npm run fixtures
      - run: npm run build:core
      - run: npm run build:web
      - name: Generate native android project
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx --yes cap add android
          fi
          npm run sync
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk

  chromeos:
    name: ChromeOS (PWA zip)
    needs: fixtures-and-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run fixtures
      - run: npm run build:core
      - run: npm run build:web
      - name: Package ChromeOS PWA bundle
        run: |
          rm -rf _chromeos && mkdir -p _chromeos/app
          cp -r dist/web/. _chromeos/app/
          {
            echo "Corrupt Office Extractor - ChromeOS"
            echo ""
            echo "ChromeOS treats PWAs as first-class apps; no APK or extension needed."
            echo ""
            echo "Install (recommended):"
            echo "  1. Open the hosted app in Chrome on your Chromebook."
            echo "  2. Click the install icon in the address bar (or menu -> Install)."
            echo "  3. The app appears in your launcher and works offline."
            echo ""
            echo "Run from this bundle (offline): unzip into Files, open app/index.html in Chrome."
            echo "Play-Store Chromebooks can alternatively sideload the Android APK."
          } > _chromeos/INSTALL-CHROMEOS.txt
          ( cd _chromeos && zip -r ../chromeos-${{ github.ref_name }}.zip . )
          ls -la chromeos-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: chromeos
          path: chromeos-*.zip

  # iOS native build needs Apple codesigning, so CI ships the installable PWA
  # (Safari -> Share -> Add to Home Screen) as the iOS deliverable. The native
  # .ipa route remains documented in tests/MANUAL.md for developers with a cert.
  ios:
    name: iOS (PWA zip)
    needs: fixtures-and-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run fixtures
      - run: npm run build:core
      - run: npm run build:web
      - name: Package iOS PWA bundle
        run: |
          rm -rf _ios && mkdir -p _ios/app
          cp -r dist/web/. _ios/app/
          {
            echo "Corrupt Office Extractor - iOS / iPadOS"
            echo ""
            echo "iOS installs this app as a Progressive Web App (no App Store or"
            echo "Apple Developer account needed for the PWA route)."
            echo ""
            echo "Install (recommended):"
            echo "  1. Open the hosted app in Safari on your iPhone/iPad."
            echo "     (Apple restricts PWA install to Safari, not Chrome on iOS.)"
            echo "  2. Tap the Share button."
            echo "  3. Tap \"Add to Home Screen\"."
            echo "  4. The app runs standalone and works offline."
            echo ""
            echo "Native .ipa build (Capacitor + Xcode + Apple cert) is documented"
            echo "in tests/MANUAL.md."
          } > _ios/INSTALL-IOS.txt
          ( cd _ios && zip -r ../ios-${{ github.ref_name }}.zip . )
          ls -la ios-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ios-*.zip

  release:
    needs: [fixtures-and-core, desktop-linux, desktop-windows, desktop-mac, android, chromeos, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Show artifacts
        run: find artifacts -type f
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true

  # Native iOS .ipa (Capacitor + Xcode) still needs Apple codesigning and is
  # documented in tests/MANUAL.md. The shipped iOS deliverable above is the
  # installable PWA, so developers with a cert can additionally attach an .ipa.
